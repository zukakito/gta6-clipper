name: gta6-clipper

on:
  schedule:
    - cron: "7,37 * * * *"        # every 30 min (GitHub may delay scheduled runs at busy times)
  workflow_dispatch:
    inputs:
      mode:
        description: "normal | scout-only"
        default: normal
      rerun:
        description: 'Re-run clips through the current pipeline: file names (comma-separated) or "since:2026-11-24T14:45Z"'
        default: ""

concurrency:
  group: clipper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
      WHOP_USER_TOKEN: ${{ secrets.WHOP_USER_TOKEN }}
      YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
      CLIPS_ZIP_PASSWORD: ${{ secrets.CLIPS_ZIP_PASSWORD }}
      CLIPPER_WORKDIR: /tmp/clipper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core tesseract-ocr > /dev/null
          mkdir -p fonts
          curl -fsSL -o fonts/Montserrat.ttf "https://github.com/google/fonts/raw/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf" || true

      - name: Python deps
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt && pip install -q -U yt-dlp

      - name: Optional yt-dlp cookies
        if: env.YTDLP_COOKIES != ''
        run: |
          printf '%s' "$YTDLP_COOKIES" > "$RUNNER_TEMP/cookies.txt"
          mkdir -p ~/.config/yt-dlp && echo "--cookies $RUNNER_TEMP/cookies.txt" > ~/.config/yt-dlp/config
          echo "YTDLP_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v3

      - name: Run pipeline
        env:
          RERUN: ${{ github.event.inputs.rerun }}
        run: |
          if [ -n "$RERUN" ]; then
            python -m pipeline.run --no-scout --rerun "$RERUN"
          elif [ "${{ github.event.inputs.mode }}" = "scout-only" ]; then
            python -m pipeline.run --scout-only
          else
            python -m pipeline.run
          fi

      - name: Encrypted backup of new clips (only if CLIPS_ZIP_PASSWORD is set)
        if: always() && env.CLIPS_ZIP_PASSWORD != ''
        run: |
          ls /tmp/clipper/out/*.mp4 >/dev/null 2>&1 || exit 0
          7z a -tzip -mem=AES256 -p"$CLIPS_ZIP_PASSWORD" /tmp/clips-encrypted.zip /tmp/clipper/out/*.mp4 > /dev/null

      - name: Keep encrypted backup (3 days)
        if: always() && env.CLIPS_ZIP_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: clips-encrypted-${{ github.run_id }}
          path: /tmp/clips-encrypted.zip
          retention-days: 3
          if-no-files-found: ignore

      - name: Save state
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "state: $(date -u +%FT%TZ) [skip ci]"
          git pull --rebase -q || true
          git push -q || true
