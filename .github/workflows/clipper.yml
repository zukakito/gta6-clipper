name: gta6-clipper

on:
  schedule:
    - cron: "7,37 * * * *"        # every 30 min (GitHub may delay scheduled runs at busy times)
  workflow_dispatch:
    inputs:
      mode:
        description: "normal | scout-only"
        default: normal

concurrency:
  group: clipper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
      WHOP_USER_TOKEN: ${{ secrets.WHOP_USER_TOKEN }}
      YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
      CLIPPER_WORKDIR: /tmp/clipper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          mkdir -p fonts
          curl -fsSL -o fonts/Montserrat.ttf "https://github.com/google/fonts/raw/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf" || true

      - name: Python deps
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt && pip install -q -U yt-dlp

      - name: Optional yt-dlp cookies
        if: env.YTDLP_COOKIES != ''
        run: |
          printf '%s' "$YTDLP_COOKIES" > "$RUNNER_TEMP/cookies.txt"
          mkdir -p ~/.config/yt-dlp && echo "--cookies $RUNNER_TEMP/cookies.txt" > ~/.config/yt-dlp/config
          echo "YTDLP_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v2

      - name: Run pipeline
        run: |
          if [ "${{ github.event.inputs.mode }}" = "scout-only" ]; then
            python -m pipeline.run --scout-only
          else
            python -m pipeline.run
          fi

      - name: Preview frames of new clips
        if: always()
        run: |
          mkdir -p state/previews
          for f in /tmp/clipper/out/*.mp4; do
            [ -e "$f" ] || continue
            n=$(basename "$f" .mp4)
            ffmpeg -v error -y -i "$f" -vf "fps=1/8,scale=270:-2,tile=5x1" -frames:v 1 -q:v 4 "state/previews/$n.jpg" || true
          done
          ls -1t state/previews/*.jpg 2>/dev/null | tail -n +21 | xargs -r rm -f

      - name: Keep rendered clips for review (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_id }}
          path: /tmp/clipper/out/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Save state
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "state: $(date -u +%FT%TZ) [skip ci]"
          git pull --rebase -q || true
          git push -q || true
