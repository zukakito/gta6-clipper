# Global pipeline settings. Edit freely; the runner re-reads this every run.

channel:
  name: "Leonida Clips - GTA 6 Streamers"
  language: "en"
  default_category_id: 20           # 20 = Gaming

posting:
  # A brand-new channel that dumps dozens of Shorts on day one looks like spam
  # to YouTube. Start modest and ramp up as the channel gains trust.
  max_uploads_per_run: 2
  max_uploads_per_day: 6             # YouTube API quota: 10,000 units/day, one upload = 1,600
  min_minutes_between_uploads: 45
  # public + schedule = upload now, go public automatically in the next daily slot (needs the API audit to pass).
  # private = drafts only, for manual publishing.
  privacy: public
  schedule:
    # Daily slots in New York time, picked for an owner in India: weekdays 13:00 ET (~23:30 IST, US lunchtime +
    # UK evening), weekends 10:00 ET (~20:30 IST, US weekend morning). Clips in one slot go public spacing_min
    # apart; the digest workflow emails the campaign links right then so they can be submitted within 30 min.
    enabled: true
    mode: slots
    slots: {weekday: "13:00", weekend: "10:00"}
    spacing_min: 5
    tz: America/New_York
    window: ["11:00", "22:00"]
    lead_min: 10
  # Where uploads go:
  #   youtube_api  -> your own Google Cloud project (public only after Google's audit)
  #   upload_post  -> Upload-Post free plan (10 public uploads/month) as a stop-gap
  #   dry_run      -> render only, no upload (good for the first test run)
  publisher: dry_run
  # Every clip must pass the local safety check (NSFW / idle / censor graphic) - always on.
  # Skip moments when no LLM (Groq/Gemini) answers, instead of posting generic titles.
  require_llm: true

digest:
  # Email at publish time (.github/workflows/digest.yml) from the owner's Gmail to the DIGEST_TO secret:
  # every clip that has gone (or is about to go) public and hasn't been emailed yet, with its campaign link.
  # Nothing is sent while publisher is dry_run.
  enabled: true

storage:
  # Finished clips go to this folder in the channel owner's Google Drive (private), never to public GitHub artifacts.
  drive_folder: "Zukakito Clips"

clipping:
  short_min_sec: 30
  short_max_sec: 58
  min_gap_same_vod_sec: 360         # skip moments within 6 min of a clip already made from the same stream
  long_target_min: 8               # long-form compilations, only for campaigns with format: long
  highlights_per_vod: 6            # candidate moments scored per VOD
  vod_lookback_hours: 48           # only clip VODs newer than this
  whisper_model: groq:whisper-large-v3-turbo   # hosted Whisper on Groq (free, same key); local model if it fails
  whisper_fallback: small
  caption_model: groq:whisper-large-v3         # re-transcribes only the final cut, for accurate on-screen captions
  caption_fallback: medium
  judge_effort: medium             # reasoning effort for the clip judge (gpt-oss on Groq)
  min_score: 7                     # judge's 1-10 score a moment needs to be rendered
  layout: auto                     # auto = facecam on top + gameplay below when a webcam is found, else zoomed gameplay

review:
  # Vision check on the finished Short: does the picture back up the hook? (Groq vision model, same key)
  enabled: true
  models: [qwen/qwen3.8-27b]
  frames: 3
  min_score: 6

scout:
  # Boards the scout reads to discover new GTA 6 campaigns.
  interval_hours: 1        # check boards every hour
  full_refresh_hours: 6    # unchanged boards are only re-sent to the LLM this often (saves Groq quota)
  boards:
    - https://clipcpm.com/gta-6
    - https://gtaclipper.com/campaigns
    - https://contentrewards.com/c/discover/clipping
  keywords: ["gta 6", "gta vi", "gta6", "grand theft auto", "leonida", "vice city"]
  # New campaigns are added to state/discovered.json. They are NOT auto-clipped
  # until the brief has been parsed and the campaign appears in campaigns.yaml
  # with enabled: true (the Claude monitor or you do this).
  auto_enable: true                # if true and Gemini parsed a YouTube-allowed brief, enable automatically
