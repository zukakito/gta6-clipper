# Campaigns the pipeline clips for. Only entries with enabled: true are processed.
# Fields:
#   id            short slug, used in state files
#   board         content_rewards | vyro | clipster | clipping_net | other
#   join_url      campaign page (where you join + submit)
#   whop_bounty_id  optional (bnty_...) -> enables automatic submission via the Whop API
#   type          cpm | pool
#   cpm           USD per 1,000 views (cpm campaigns)
#   min_views_to_pay / cap_usd   per-clip limits from the brief
#   sources       channels whose VODs are authorised footage (twitch/kick/youtube URLs)
#   format        short | long | both
#   must_include  text that must appear in the title/caption (names, hashtags)
#   overlay_text  on-screen text burned into the clip (e.g. required name)
#   rules         free-text rules from the brief (read by the LLM when writing metadata)
#   submit_within_min  submit link to the campaign within N minutes of posting
#   verified_brief  true once someone has read the full brief behind the join button
#
# Snapshot built 20 Nov 2026 from public campaign listings. Rates/budgets move fast;
# the scout + Claude monitor keep this current.

defaults:
  paid_disclosure: true            # Content Rewards requires a clear paid disclosure at the start
  submit_within_min: 30
  format: short

